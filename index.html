<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herbi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herbi">
<meta name="theme-color" content="#3E5C3A">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #F5F1E6;
  --surface: #FFFFFF;
  --border: #E2DCC8;
  --text: #2B2A25;
  --text-muted: #6B6558;
  --primary: #3E5C3A;
  --primary-dark: #2A4028;
  --primary-tint: #E7EEE2;
  --accent: #B3541E;
  --warn: #A33A2C;
  --warn-tint: #F6E1DD;
  --radius: 10px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-bottom: 40px;
}
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; margin: 0 0 .4em; color: var(--primary-dark); }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
header.top {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 16px; position: sticky; top: 0; z-index: 10;
}
.brand { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.25rem; color: var(--primary-dark); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button {
  background: none; border: none; color: var(--text-muted); padding: 8px 12px;
  border-radius: 999px; font-weight: 500; font-size: .88rem; cursor: pointer;
  font-family: inherit; white-space: nowrap;
}
nav.tabs button.active { background: var(--primary); color: #fff; }
main { max-width: 720px; margin: 0 auto; padding: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.divider { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; color: var(--text-muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
.divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
label { display: block; font-size: .8rem; color: var(--text-muted); margin-bottom: 3px; }
input[type=text], input[type=number], input[type=password], input[type=date], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); font-family: inherit; font-size: .95rem; color: var(--text);
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
.field { margin-bottom: 10px; }
.field-row { display: flex; gap: 8px; flex-wrap: wrap; }
.field-row > .field { flex: 1; min-width: 90px; }
button, .btn {
  display: inline-flex; align-items: center; gap: 5px; background: var(--primary); color: #fff;
  border: none; padding: 9px 14px; border-radius: 8px; font-size: .88rem; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
button:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--primary-tint); }
.btn-accent { background: var(--accent); }
.btn-danger { background: var(--surface); color: var(--warn); border: 1px solid var(--warn-tint); }
.btn-small { padding: 5px 9px; font-size: .78rem; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); padding: 6px; }
td { padding: 8px 6px; border-bottom: 1px solid var(--border); }
.tag-pill { display: inline-block; background: var(--primary-tint); color: var(--primary-dark); padding: 1px 7px; border-radius: 999px; font-size: .72rem; margin-right: 3px; }
.ing-row { display: grid; grid-template-columns: 1.6fr .8fr .7fr 1fr .8fr auto; gap: 4px; margin-bottom: 5px; align-items: center; }
.ing-header { display: grid; grid-template-columns: 1.6fr .8fr .7fr 1fr .8fr auto; gap: 4px; font-size: .68rem; color: var(--text-muted); margin-bottom: 3px; }
.remove-row { background: transparent; color: var(--warn); border: none; font-size: 1rem; cursor: pointer; padding: 2px 6px; }
.equipment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 5px 8px; margin: 6px 0 14px; }
.equipment-grid label { display: flex; align-items: center; gap: 5px; color: var(--text); font-size: .85rem; margin: 0; }
.equipment-grid input { width: auto; }
.week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
.week-days { display: flex; flex-direction: column; gap: 10px; }
.day-card { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--primary); border-radius: var(--radius); padding: 10px; }
.day-card h3 { font-size: .92rem; margin-bottom: 6px; }
.plan-item { background: var(--primary-tint); border-radius: 6px; padding: 6px 8px; margin-bottom: 5px; font-size: .85rem; display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; }
.plan-item.warn { background: var(--warn-tint); }
.warn-note { display: block; font-size: .7rem; color: var(--warn); margin-top: 2px; }
.remove-x { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: .9rem; padding: 0; }
.budget-banner { padding: 9px 12px; border-radius: 8px; margin-bottom: 12px; font-weight: 600; font-size: .88rem; }
.budget-ok { background: var(--primary-tint); color: var(--primary-dark); }
.budget-over { background: var(--warn-tint); color: var(--warn); }
.budget-neutral { background: var(--border); color: var(--text); }
.shopping-item { display: flex; align-items: center; gap: 8px; padding: 5px 2px; }
.shopping-item input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--primary); flex-shrink:0; }
.shopping-item.checked label { text-decoration: line-through; color: var(--text-muted); }
.item-meta { color: var(--text-muted); font-size: .82rem; }
.order-list { list-style: none; margin: 0; padding: 0; }
.order-list li { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; margin-bottom: 5px; }
.status-pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .78rem; }
.status-pill.set { background: var(--primary-tint); color: var(--primary-dark); }
.status-pill.unset { background: var(--warn-tint); color: var(--warn); }
.empty-state { color: var(--text-muted); padding: 24px 0; text-align: center; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--primary-dark); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .85rem; z-index: 100; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
</style>
</head>
<body>

<header class="top">
  <div class="brand">🌿 Herbi</div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>

<script>
/* ---------------- State & Storage ---------------- */

const CATEGORIES = ["produce","bakery","dairy","meat","frozen","pantry","spices","other"];
const CATEGORY_LABELS = {
  produce: "Obst & Gemüse", dairy: "Milchprodukte", meat: "Fleisch & Fisch",
  bakery: "Backwaren", pantry: "Vorrat / Trockenware", frozen: "Tiefkühl",
  spices: "Gewürze", other: "Sonstiges"
};
const DEFAULT_APPLIANCES = ["Backofen","Herd","Mikrowelle","Airfryer","Standmixer","Stabmixer","Toaster","Wasserkocher","Reiskocher","Slow Cooker","Sandwichmaker","Grill"];
const WEEKDAYS = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

// Grobe, typische Gang-Reihenfolgen als Startvorlage — reale Filialen weichen ab,
// deshalb bleibt die Reihenfolge danach frei per ▲/▼ anpassbar.
const SUPERMARKET_PRESETS = {
  "": { label: "Kein Stammsupermarkt (eigene Reihenfolge)", order: null },
  rewe: { label: "Rewe", order: ["produce","bakery","dairy","meat","frozen","pantry","spices","other"] },
  edeka: { label: "Edeka", order: ["produce","bakery","dairy","meat","pantry","frozen","spices","other"] },
  aldi: { label: "Aldi", order: ["bakery","produce","dairy","meat","pantry","frozen","spices","other"] },
  lidl: { label: "Lidl", order: ["produce","bakery","dairy","frozen","meat","pantry","spices","other"] },
  kaufland: { label: "Kaufland", order: ["produce","bakery","meat","dairy","frozen","pantry","spices","other"] },
  netto: { label: "Netto", order: ["bakery","produce","dairy","meat","frozen","pantry","spices","other"] },
};

var state = {
  recipes: [],
  plan: [],
  settings: {
    ownedAppliances: [], customAppliances: [], weeklyBudget: null,
    categoryOrder: [...CATEGORIES], supermarketName: "", selectedSupermarket: "", checked: {}
  },
  activeTab: "planner",
  plannerWeekStart: null,
  shoppingStart: null,
  shoppingEnd: null,
  editingRecipeId: null,
  recipeDraft: null,
};

function uid() { return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

async function loadState() {
  try { state.recipes = JSON.parse(localStorage.getItem('herbi_recipes') || '[]'); } catch(e) { state.recipes = []; }
  try { state.plan = JSON.parse(localStorage.getItem('herbi_plan') || '[]'); } catch(e) { state.plan = []; }
  try {
    const s = JSON.parse(localStorage.getItem('herbi_settings') || '{}');
    state.settings = Object.assign(state.settings, s);
  } catch(e) { /* defaults bleiben */ }
}
async function saveRecipes() {
  try { localStorage.setItem('herbi_recipes', JSON.stringify(state.recipes)); return true; }
  catch(e) { console.error('saveRecipes fehlgeschlagen:', e); toast('⚠ Speichern der Rezepte fehlgeschlagen.'); return false; }
}
async function savePlan() {
  try { localStorage.setItem('herbi_plan', JSON.stringify(state.plan)); return true; }
  catch(e) { console.error('savePlan fehlgeschlagen:', e); toast('⚠ Speichern des Wochenplans fehlgeschlagen.'); return false; }
}
async function saveSettings() {
  try { localStorage.setItem('herbi_settings', JSON.stringify(state.settings)); return true; }
  catch(e) { console.error('saveSettings fehlgeschlagen:', e); toast('⚠ Speichern der Einstellungen fehlgeschlagen: ' + e.message); return false; }
}

function getApiKey() { return localStorage.getItem('herbi_api_key') || ''; }
function setApiKey(key) { localStorage.setItem('herbi_api_key', (key || '').trim()); }
function hasApiKey() { return !!getApiKey(); }
function ensureApiKey() {
  if (!hasApiKey()) {
    toast('Bitte zuerst einen Anthropic API-Key unter Einstellungen eintragen.');
    switchTab('settings');
    return false;
  }
  return true;
}

function allAppliances() {
  const custom = state.settings.customAppliances || [];
  return [...DEFAULT_APPLIANCES, ...custom.filter(a => !DEFAULT_APPLIANCES.includes(a))];
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

/* ---------------- Datumshilfen ---------------- */

function fmtISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return fmtISO(d);
}
function mondayOf(iso) {
  const d = new Date(iso + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return fmtISO(d);
}
function fmtDE(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

/* ---------------- Anthropic API (KI-Funktionen) ---------------- */

async function callClaude(prompt, maxTokens=600) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error('Kein API-Key hinterlegt. Bitte unter Einstellungen eintragen.');

  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: maxTokens,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message || 'API-Fehler');
  const text = (data.content || []).map(b => b.text || "").join("");
  const cleaned = text.replace(/^```json\s*|\s*```$/g, "").trim();
  const match = cleaned.match(/[\{\[][\s\S]*[\}\]]/);
  return JSON.parse(match ? match[0] : cleaned);
}

/* ---------------- Router / Tabs ---------------- */

const TABS = [
  { id: "recipes", label: "Rezepte" },
  { id: "planner", label: "Wochenplan" },
  { id: "shopping", label: "Einkaufsliste" },
  { id: "settings", label: "Einstellungen" },
];

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t =>
    `<button class="${state.activeTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}
function switchTab(tab) {
  state.activeTab = tab;
  state.editingRecipeId = undefined;
  render();
}
function render() {
  renderTabs();
  const app = document.getElementById('app');
  if (state.activeTab === 'recipes') app.innerHTML = renderRecipesView();
  else if (state.activeTab === 'planner') app.innerHTML = renderPlannerView();
  else if (state.activeTab === 'shopping') app.innerHTML = renderShoppingView();
  else if (state.activeTab === 'settings') app.innerHTML = renderSettingsView();
}

/* ---------------- Rezepte ---------------- */

function renderRecipesView() {
  if (state.editingRecipeId !== undefined) return renderRecipeForm();
  const query = (state.recipeQuery || "").toLowerCase();
  const list = state.recipes.filter(r => !query || (r.name + " " + (r.tags||"")).toLowerCase().includes(query));
  return `
    <div class="toolbar">
      <button onclick="openRecipeForm(null)">+ Neues Rezept</button>
      <button class="btn-accent" onclick="generateRecipeWithAI()">✨ Per KI generieren</button>
      <input type="text" placeholder="Suche…" style="max-width:140px;margin-left:auto;"
             value="${state.recipeQuery || ''}" oninput="state.recipeQuery=this.value; render();">
    </div>
    <div class="card">
      ${list.length === 0 ? `<div class="empty-state">Noch keine Rezepte. Leg dein erstes an.</div>` : `
      <table>
        <thead><tr><th>Name</th><th>Portionen</th><th>Zeit</th><th>Tags</th><th></th></tr></thead>
        <tbody>
          ${list.map(r => `
            <tr>
              <td><a href="#" onclick="openRecipeForm('${r.id}'); return false;" style="color:var(--text);font-weight:600;text-decoration:none;">${escapeHtml(r.name)}</a></td>
              <td>${r.servings}</td>
              <td>${r.prepMinutes || '–'} Min</td>
              <td>${(r.tags||'').split(',').filter(Boolean).map(t=>`<span class="tag-pill">${escapeHtml(t.trim())}</span>`).join('') || '–'}</td>
              <td style="white-space:nowrap;">
                <button class="btn-secondary btn-small" onclick="openRecipeForm('${r.id}')">Bearbeiten</button>
                <button class="btn-danger btn-small" onclick="deleteRecipe('${r.id}')">Löschen</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;
}

function openRecipeForm(id) {
  state.editingRecipeId = id || null;
  state.recipeDraft = null;
  render();
  initRecipeFormRows(id ? state.recipes.find(r => r.id === id) : null);
}

function currentFormRecipe() {
  if (state.editingRecipeId) return state.recipes.find(r => r.id === state.editingRecipeId);
  return state.recipeDraft || null;
}

function initRecipeFormRows(recipeLike) {
  const ingredients = recipeLike ? (recipeLike.ingredients || []) : [];
  const container = document.getElementById('ingredient-rows');
  container.innerHTML = '';
  if (ingredients.length) ingredients.forEach(addIngredientRow);
  else addIngredientRow();
}

function renderRecipeForm() {
  const recipe = currentFormRecipe();
  const isDraft = !state.editingRecipeId && !!state.recipeDraft;
  const equipment = recipe ? (recipe.equipment || []) : [];
  return `
    <h1>${state.editingRecipeId ? 'Rezept bearbeiten' : (isDraft ? 'KI-Vorschlag prüfen & speichern' : 'Neues Rezept')}</h1>
    ${isDraft ? `<div class="card" style="background:var(--primary-tint);border-color:var(--primary);margin-bottom:10px;">
        <p style="margin:0;font-size:.88rem;color:var(--primary-dark);">🌿 Von der KI vorgeschlagen — prüf die Angaben (v.a. Preise & Mengen) und passe an, bevor du speicherst.</p>
      </div>` : ''}
    <div class="card">
      <div class="field"><label>Name</label><input type="text" id="f-name" value="${recipe ? escapeAttr(recipe.name) : ''}"></div>
      <div class="field-row">
        <div class="field"><label>Portionen</label><input type="number" id="f-servings" min="1" value="${recipe ? recipe.servings : 2}"></div>
        <div class="field"><label>Zeit (Min)</label><input type="number" id="f-prep" min="0" value="${recipe ? (recipe.prepMinutes||0) : 20}"></div>
        <div class="field"><label>kcal/Portion</label><input type="number" id="f-calories" min="0" value="${recipe && recipe.calories ? recipe.calories : ''}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Tags (Komma-getrennt)</label><input type="text" id="f-tags" value="${recipe ? escapeAttr(recipe.tags||'') : ''}"></div>
        <div class="field"><label>Quelle (URL)</label><input type="text" id="f-source" value="${recipe ? escapeAttr(recipe.sourceUrl||'') : ''}"></div>
      </div>

      <div class="divider">Benötigte Küchengeräte</div>
      <div class="equipment-grid">
        ${allAppliances().map(a => `
          <label><input type="checkbox" name="f-equipment" value="${escapeAttr(a)}" ${equipment.includes(a)?'checked':''}> ${escapeHtml(a)}</label>
        `).join('')}
      </div>

      <div class="divider">Zutaten</div>
      <div class="toolbar" style="margin-bottom:6px;">
        <button type="button" class="btn-secondary btn-small" onclick="addIngredientRow()">+ Zutat</button>
        <button type="button" class="btn-accent btn-small" onclick="estimatePrices()">💶 Preise schätzen (KI)</button>
        <span id="price-status" class="item-meta"></span>
      </div>
      <div class="ing-header"><span>Zutat</span><span>Menge</span><span>Einh.</span><span>Kategorie</span><span>Preis €</span><span></span></div>
      <div id="ingredient-rows"></div>

      <div class="divider">Anleitung</div>
      <div class="field"><textarea id="f-instructions" rows="6">${recipe ? escapeHtml(recipe.instructions||'') : ''}</textarea></div>

      <div class="toolbar">
        <button onclick="saveRecipeForm()">Speichern</button>
        <button class="btn-secondary" onclick="state.editingRecipeId=undefined; state.recipeDraft=null; render();">Abbrechen</button>
      </div>
    </div>
  `;
}

function addIngredientRow(data) {
  data = data || {};
  const container = document.getElementById('ingredient-rows');
  const row = document.createElement('div');
  row.className = 'ing-row';
  row.innerHTML = `
    <input type="text" class="ing-name" value="${escapeAttr(data.name||'')}">
    <input type="number" class="ing-amount" step="any" value="${data.amount ?? ''}">
    <input type="text" class="ing-unit" value="${escapeAttr(data.unit||'')}">
    <select class="ing-category">
      ${CATEGORIES.map(c => `<option value="${c}" ${(data.category||'produce')===c?'selected':''}>${CATEGORY_LABELS[c]}</option>`).join('')}
    </select>
    <input type="number" class="ing-price" step="0.01" value="${data.price ?? ''}">
    <button type="button" class="remove-row" onclick="this.closest('.ing-row').remove()">✕</button>
  `;
  container.appendChild(row);
}

function saveRecipeForm() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Bitte einen Namen eingeben.'); return; }
  const equipment = Array.from(document.querySelectorAll('input[name="f-equipment"]:checked')).map(el => el.value);
  const rows = document.querySelectorAll('#ingredient-rows .ing-row');
  const ingredients = [];
  rows.forEach(row => {
    const ingName = row.querySelector('.ing-name').value.trim();
    if (!ingName) return;
    const amountRaw = row.querySelector('.ing-amount').value;
    const priceRaw = row.querySelector('.ing-price').value;
    ingredients.push({
      name: ingName,
      amount: amountRaw ? parseFloat(amountRaw) : null,
      unit: row.querySelector('.ing-unit').value.trim(),
      category: row.querySelector('.ing-category').value,
      price: priceRaw ? parseFloat(priceRaw) : null,
    });
  });

  const data = {
    name,
    servings: parseInt(document.getElementById('f-servings').value || '2', 10),
    prepMinutes: parseInt(document.getElementById('f-prep').value || '0', 10),
    calories: document.getElementById('f-calories').value ? parseInt(document.getElementById('f-calories').value, 10) : null,
    tags: document.getElementById('f-tags').value.trim(),
    sourceUrl: document.getElementById('f-source').value.trim(),
    instructions: document.getElementById('f-instructions').value.trim(),
    equipment,
    ingredients,
  };

  if (state.editingRecipeId) {
    const idx = state.recipes.findIndex(r => r.id === state.editingRecipeId);
    state.recipes[idx] = { ...state.recipes[idx], ...data };
  } else {
    state.recipes.push({ id: uid(), ...data });
  }
  saveRecipes();
  state.editingRecipeId = undefined;
  state.recipeDraft = null;
  toast('Rezept gespeichert.');
  render();
}

async function generateRecipeWithAI() {
  if (!ensureApiKey()) return;
  const wish = window.prompt(
    "Was für ein Rezept soll die KI erstellen?\n(z.B. \"schnelles veganes Nudelgericht für 2 Personen\", \"proteinreiches Frühstück\", \"Resteverwertung mit Hackfleisch und Paprika\")"
  );
  if (!wish || !wish.trim()) return;

  toast('KI erstellt Rezept…');
  const prompt = `Erstelle ein Kochrezept basierend auf diesem Wunsch: "${wish.trim()}".

Antworte AUSSCHLIESSLICH mit einem JSON-Objekt, keine Erklärung, kein Markdown, kein Codeblock.
Format exakt so:
{
  "name": "Rezeptname",
  "servings": 2,
  "prepMinutes": 25,
  "calories": 550,
  "tags": "vegan,schnell",
  "equipment": ["Herd"],
  "instructions": "Schritt-für-Schritt-Anleitung als Fließtext, nummeriert.",
  "ingredients": [
    {"name": "Zutat", "amount": 200, "unit": "g", "category": "pantry", "price": 1.50}
  ]
}

Regeln:
- equipment: nur Werte aus dieser Liste verwenden: ${allAppliances().join(", ")}
- ingredients[].category: nur Werte aus dieser Liste: ${CATEGORIES.join(", ")}
- ingredients[].price: grobe Schätzung in Euro (deutscher Supermarkt-Durchschnitt) für die angegebene Menge
- Mengen realistisch für die angegebene Portionenzahl`;

  try {
    const draft = await callClaude(prompt, 1200);
    if (!draft.name || !Array.isArray(draft.ingredients)) {
      throw new Error('Unvollständige Antwort');
    }
    draft.tags = draft.tags || '';
    draft.sourceUrl = '';
    draft.equipment = Array.isArray(draft.equipment) ? draft.equipment : [];
    draft.ingredients = draft.ingredients.map(i => ({
      name: i.name, amount: i.amount ?? null, unit: i.unit || '',
      category: CATEGORIES.includes(i.category) ? i.category : 'other',
      price: i.price ?? null,
    }));
    state.activeTab = 'recipes';
    state.editingRecipeId = null;
    state.recipeDraft = draft;
    render();
    initRecipeFormRows(draft);
    toast('Vorschlag bereit — bitte prüfen & speichern.');
  } catch (e) {
    toast('KI-Rezept konnte nicht erstellt werden.');
    console.error(e);
  }
}

function deleteRecipe(id) {
  if (!confirm('Dieses Rezept wirklich löschen?')) return;
  state.recipes = state.recipes.filter(r => r.id !== id);
  state.plan = state.plan.filter(p => p.recipeId !== id);
  saveRecipes(); savePlan();
  render();
}

async function estimatePrices() {
  if (!ensureApiKey()) return;
  const rows = document.querySelectorAll('#ingredient-rows .ing-row');
  const items = [];
  rows.forEach(row => {
    const n = row.querySelector('.ing-name').value.trim();
    if (!n) return;
    items.push({ name: n, amount: row.querySelector('.ing-amount').value, unit: row.querySelector('.ing-unit').value });
  });
  if (!items.length) { toast('Erst Zutaten eintragen.'); return; }
  const statusEl = document.getElementById('price-status');
  statusEl.textContent = 'Schätze Preise…';
  const itemsStr = items.map(i => `- ${i.name}: ${i.amount||'?'} ${i.unit||''}`.trim()).join('\n');
  const prompt = `Schätze grobe, realistische Supermarktpreise in Euro (deutscher Durchschnitt, z.B. Rewe/Edeka-Niveau) für folgende Zutaten in den jeweils angegebenen Mengen:\n\n${itemsStr}\n\nAntworte AUSSCHLIESSLICH mit einem JSON-Objekt, keine Erklärung, kein Markdown.\nFormat exakt so: {"Zutatname": 1.99, "Zutatname2": 0.50}\nVerwende exakt die Zutatnamen aus der Liste oben als Keys. Preise als Dezimalzahl in Euro, für die angegebene Menge (nicht pro kg).`;
  try {
    const prices = await callClaude(prompt, 800);
    rows.forEach(row => {
      const n = row.querySelector('.ing-name').value.trim();
      if (prices[n] !== undefined) row.querySelector('.ing-price').value = Number(prices[n]).toFixed(2);
    });
    statusEl.textContent = 'Preise aktualisiert.';
  } catch (e) {
    statusEl.textContent = '';
    toast('Preisschätzung fehlgeschlagen.');
    console.error(e);
  }
}

/* ---------------- Wochenplan ---------------- */

function missingEquipment(recipe) {
  if (!recipe || !recipe.equipment) return [];
  const owned = new Set(state.settings.ownedAppliances || []);
  return recipe.equipment.filter(e => !owned.has(e));
}

function renderPlannerView() {
  if (!state.plannerWeekStart) state.plannerWeekStart = mondayOf(fmtISO(new Date()));
  const weekStart = state.plannerWeekStart;
  const weekEnd = addDays(weekStart, 6);

  const days = [];
  for (let i = 0; i < 7; i++) {
    const iso = addDays(weekStart, i);
    const entries = state.plan.filter(p => p.date === iso).map(p => {
      const recipe = state.recipes.find(r => r.id === p.recipeId);
      return { ...p, recipe, missing: recipe ? missingEquipment(recipe) : [] };
    }).filter(e => e.recipe);
    days.push({ iso, label: `${WEEKDAYS[i]} ${fmtDE(iso).slice(0,5)}`, entries });
  }

  return `
    <div class="week-nav">
      <button class="btn-secondary btn-small" onclick="state.plannerWeekStart=addDays(state.plannerWeekStart,-7); render();">◀</button>
      <h2 style="margin:0;font-size:1rem;">${fmtDE(weekStart)} – ${fmtDE(weekEnd)}</h2>
      <button class="btn-secondary btn-small" onclick="state.plannerWeekStart=addDays(state.plannerWeekStart,7); render();">▶</button>
    </div>
    <div class="toolbar">
      <button class="btn-accent btn-small" onclick="aiSuggestWeek()">✨ KI-Vorschlag</button>
      <button class="btn-danger btn-small" onclick="clearWeek()">Woche leeren</button>
    </div>
    ${state.recipes.length === 0 ? `<div class="empty-state">Noch keine Rezepte — leg zuerst welche unter "Rezepte" an.</div>` : `
    <div class="week-days">
      ${days.map(day => `
        <div class="day-card">
          <h3>${day.label}</h3>
          ${day.entries.map(e => `
            <div class="plan-item ${e.missing.length ? 'warn' : ''}">
              <div>${escapeHtml(e.recipe.name)}${e.servingsOverride ? ` (${e.servingsOverride}P)` : ''}
                ${e.missing.length ? `<span class="warn-note">⚠ fehlt: ${e.missing.join(', ')}</span>` : ''}
              </div>
              <button class="remove-x" onclick="removePlanEntry('${e.id}')">✕</button>
            </div>
          `).join('')}
          <select style="margin-top:4px;font-size:.82rem;" onchange="addPlanEntry('${day.iso}', this.value); this.value='';">
            <option value="" selected disabled>+ Rezept hinzufügen…</option>
            ${state.recipes.map(r => `<option value="${r.id}">${missingEquipment(r).length?'⚠ ':''}${escapeHtml(r.name)} (${r.servings}P)</option>`).join('')}
          </select>
        </div>
      `).join('')}
    </div>`}
  `;
}

function addPlanEntry(date, recipeId) {
  if (!recipeId) return;
  state.plan.push({ id: uid(), date, recipeId, servingsOverride: null });
  savePlan();
  render();
}
function removePlanEntry(id) {
  state.plan = state.plan.filter(p => p.id !== id);
  savePlan();
  render();
}
function clearWeek() {
  if (!confirm('Alle Einträge dieser Woche entfernen?')) return;
  const start = state.plannerWeekStart, end = addDays(start, 6);
  state.plan = state.plan.filter(p => p.date < start || p.date > end);
  savePlan();
  render();
}

async function aiSuggestWeek() {
  if (!ensureApiKey()) return;
  if (state.recipes.length < 3) { toast('Lege mindestens 3 Rezepte an.'); return; }
  toast('KI denkt nach…');
  const names = state.recipes.map(r => r.name);
  const prompt = `Du bekommst eine Liste von Rezepten. Erstelle daraus einen abwechslungsreichen 7-Tage-Essensplan (Montag bis Sonntag), indem du jedem Tag genau ein Rezept aus der Liste zuordnest. Rezepte dürfen mehrfach vorkommen, aber bevorzuge Abwechslung.\n\nVerfügbare Rezepte:\n${names.map(n=>'- '+n).join('\n')}\n\nAntworte AUSSCHLIESSLICH mit einem JSON-Objekt, keine Erklärung, kein Markdown.\nFormat exakt so: {"0": "Rezeptname für Montag", "1": "...", "2": "...", "3": "...", "4": "...", "5": "...", "6": "..."}\nDie Rezeptnamen müssen exakt aus der Liste oben übernommen werden.`;
  try {
    const suggestion = await callClaude(prompt, 500);
    const nameToId = {}; state.recipes.forEach(r => nameToId[r.name] = r.id);
    const start = state.plannerWeekStart, end = addDays(start, 6);
    state.plan = state.plan.filter(p => p.date < start || p.date > end);
    let added = 0;
    for (let i = 0; i < 7; i++) {
      const recipeName = suggestion[String(i)];
      if (recipeName && nameToId[recipeName]) {
        state.plan.push({ id: uid(), date: addDays(start, i), recipeId: nameToId[recipeName], servingsOverride: null });
        added++;
      }
    }
    savePlan();
    toast(`${added} Tage gefüllt.`);
    render();
  } catch (e) {
    toast('KI-Vorschlag fehlgeschlagen.');
    console.error(e);
  }
}

/* ---------------- Einkaufsliste ---------------- */

function computeShoppingList(start, end) {
  const relevant = state.plan.filter(p => p.date >= start && p.date <= end);
  const aggregated = {};
  relevant.forEach(p => {
    const recipe = state.recipes.find(r => r.id === p.recipeId);
    if (!recipe) return;
    const scale = (p.servingsOverride && recipe.servings) ? p.servingsOverride / recipe.servings : 1;
    (recipe.ingredients || []).forEach(ing => {
      const key = `${ing.name.trim().toLowerCase()}|${ing.unit||''}`;
      const amount = (ing.amount || 0) * scale;
      const price = (ing.price || 0) * scale;
      if (!aggregated[key]) {
        aggregated[key] = { name: ing.name.trim(), amount, unit: ing.unit||'', category: ing.category||'other', price, itemKey: key };
      } else {
        aggregated[key].amount += amount;
        aggregated[key].price += price;
      }
    });
  });
  const byCategory = {};
  CATEGORIES.forEach(c => byCategory[c] = []);
  Object.values(aggregated).forEach(item => {
    item.checked = !!state.settings.checked[item.itemKey];
    byCategory[item.category] = byCategory[item.category] || [];
    byCategory[item.category].push(item);
  });
  Object.values(byCategory).forEach(list => list.sort((a,b) => a.name.localeCompare(b.name)));
  return byCategory;
}

function renderShoppingView() {
  if (!state.plannerWeekStart) state.plannerWeekStart = mondayOf(fmtISO(new Date()));
  if (!state.shoppingStart) {
    // Standard: dieselbe Woche, die gerade im Wochenplan angezeigt wird
    state.shoppingStart = state.plannerWeekStart;
    state.shoppingEnd = addDays(state.plannerWeekStart, 6);
  }
  const byCategory = computeShoppingList(state.shoppingStart, state.shoppingEnd);
  const total = Object.values(byCategory).flat().reduce((s, i) => s + (i.price||0), 0);
  const budget = state.settings.weeklyBudget;
  const hasItems = Object.values(byCategory).some(l => l.length);

  let banner = '';
  if (budget) {
    const over = total > budget;
    banner = `<div class="budget-banner ${over?'budget-over':'budget-ok'}">Geschätzte Kosten: ${total.toFixed(2)}€ / Budget ${budget.toFixed(2)}€ ${over ? `— ⚠ ${(total-budget).toFixed(2)}€ über Budget` : `— noch ${(budget-total).toFixed(2)}€ übrig`}</div>`;
  } else if (total > 0) {
    banner = `<div class="budget-banner budget-neutral">Geschätzte Kosten: ${total.toFixed(2)}€ (kein Wochenbudget gesetzt)</div>`;
  }

  const order = state.settings.categoryOrder && state.settings.categoryOrder.length ? state.settings.categoryOrder : CATEGORIES;

  return `
    <div class="field-row">
      <div class="field"><label>Von</label><input type="date" value="${state.shoppingStart}" onchange="state.shoppingStart=this.value; render();"></div>
      <div class="field"><label>Bis</label><input type="date" value="${state.shoppingEnd}" onchange="state.shoppingEnd=this.value; render();"></div>
    </div>
    <div class="toolbar">
      <button class="btn-secondary btn-small" onclick="resetChecked()">Abgehakte zurücksetzen</button>
      <button class="btn-secondary btn-small" onclick="syncShoppingToPlannerWeek()">🔄 Wochenplan-Woche übernehmen</button>
    </div>
    ${banner}
    ${!hasItems ? `<div class="empty-state">Keine geplanten Rezepte in diesem Zeitraum.</div>` : order.map(cat => {
      const items = byCategory[cat] || [];
      if (!items.length) return '';
      return `
        <h3 style="margin-top:16px;">${CATEGORY_LABELS[cat]||cat}</h3>
        ${items.map(item => `
          <div class="shopping-item ${item.checked?'checked':''}">
            <input type="checkbox" ${item.checked?'checked':''} onchange="toggleChecked('${item.itemKey}', this.checked)">
            <label>${escapeHtml(item.name)}
              ${item.amount ? `<span class="item-meta">— ${trimNum(item.amount)} ${escapeHtml(item.unit)}</span>` : ''}
              ${item.price ? `<span class="item-meta">· ~${item.price.toFixed(2)}€</span>` : ''}
            </label>
          </div>
        `).join('')}
      `;
    }).join('')}
  `;
}
function trimNum(n) { return Math.round(n*100)/100; }
function toggleChecked(itemKey, checked) {
  state.settings.checked[itemKey] = checked;
  saveSettings();
  render();
}
function resetChecked() {
  state.settings.checked = {};
  saveSettings();
  render();
}
function syncShoppingToPlannerWeek() {
  state.shoppingStart = state.plannerWeekStart || mondayOf(fmtISO(new Date()));
  state.shoppingEnd = addDays(state.shoppingStart, 6);
  render();
}

/* ---------------- Einstellungen ---------------- */

function renderSettingsView() {
  const owned = new Set(state.settings.ownedAppliances || []);
  const order = state.settings.categoryOrder && state.settings.categoryOrder.length ? state.settings.categoryOrder : CATEGORIES;
  return `
    <h2>Meine Küchengeräte</h2>
    <p class="item-meta">Für Warnungen im Wochenplan, wenn ein Rezept ein Gerät braucht, das du nicht hast.</p>
    <div class="card">
      <div class="equipment-grid">
        ${allAppliances().map(a => `<label><input type="checkbox" class="settings-appliance" value="${escapeAttr(a)}" ${owned.has(a)?'checked':''}> ${escapeHtml(a)}</label>`).join('')}
      </div>
      <div class="field-row" style="align-items:end;">
        <div class="field"><label>Eigenes Gerät hinzufügen</label><input type="text" id="new-appliance" placeholder="z.B. Sous-Vide"></div>
      </div>
      <button onclick="saveAppliances()">Geräte speichern</button>
    </div>

    <div class="divider">Wochenbudget</div>
    <div class="card">
      <div class="field" style="max-width:160px;"><label>Budget pro Woche (€)</label>
        <input type="number" step="0.01" id="budget-input" value="${state.settings.weeklyBudget != null ? state.settings.weeklyBudget.toFixed(2) : ''}">
      </div>
      <button onclick="saveBudget()">Speichern</button>
    </div>

    <div class="divider">Supermarkt-Sortierung</div>
    <p class="item-meta">Reihenfolge der Kategorien in der Einkaufsliste.</p>
    <div class="card">
      <div class="field" style="max-width:260px;">
        <label>Stammsupermarkt</label>
        <select id="supermarket-select" onchange="applySupermarketPreset(this.value)">
          ${Object.entries(SUPERMARKET_PRESETS).map(([key, p]) =>
            `<option value="${key}" ${state.settings.selectedSupermarket === key ? 'selected' : ''}>${p.label}</option>`
          ).join('')}
        </select>
      </div>
      <p class="item-meta" style="margin-top:-4px;">Setzt eine typische Startreihenfolge — ist nur eine grobe Annäherung, danach unten per ▲/▼ an deine Filiale anpassen.</p>
      <div class="field" style="max-width:220px;">
        <label>Eigener Name/Notiz (optional)</label>
        <input type="text" id="supermarket-name" value="${escapeAttr(state.settings.supermarketName||'')}">
      </div>
      <ul class="order-list" id="order-list">
        ${order.map(cat => `
          <li data-cat="${cat}">
            <span>${CATEGORY_LABELS[cat]||cat}</span>
            <span>
              <button type="button" class="btn-secondary btn-small" onclick="moveOrder('${cat}',-1)">▲</button>
              <button type="button" class="btn-secondary btn-small" onclick="moveOrder('${cat}',1)">▼</button>
            </span>
          </li>
        `).join('')}
      </ul>
      <button onclick="saveOrder()" style="margin-top:8px;">Sortierung speichern</button>
    </div>

    <div class="divider">Anthropic API-Key</div>
    <p class="item-meta">Für KI-Vorschlag (Wochenplan), Preisschätzung und KI-Rezepte. Key erstellen unter
      <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com/settings/keys</a>.
      Der Key bleibt nur lokal in diesem Browser gespeichert (localStorage) — er wird nirgends hochgeladen.</p>
    <div class="card">
      <p>Status:
        <span class="status-pill ${hasApiKey() ? 'set' : 'unset'}">${hasApiKey() ? '✓ gesetzt' : 'nicht gesetzt'}</span>
      </p>
      <div class="field-row" style="align-items:end;">
        <div class="field"><label>API-Key</label><input type="password" id="api-key-input" placeholder="sk-ant-..." value="${hasApiKey() ? '••••••••••••••••' : ''}"></div>
      </div>
      <button onclick="saveApiKeyFromForm()">Speichern</button>
    </div>
  `;
}

function saveApiKeyFromForm() {
  const raw = document.getElementById('api-key-input').value;
  if (raw === '••••••••••••••••') { toast('Key unverändert.'); return; } // Maskierter Platzhalter, nicht überschrieben
  if (!raw.trim()) { toast('Bitte einen Key eingeben.'); return; }
  setApiKey(raw);
  toast('API-Key gespeichert.');
  render();
}

function saveAppliances() {
  const selected = Array.from(document.querySelectorAll('.settings-appliance:checked')).map(el => el.value);
  const newAppliance = document.getElementById('new-appliance').value.trim();
  if (newAppliance) {
    if (!state.settings.customAppliances) state.settings.customAppliances = [];
    if (!state.settings.customAppliances.includes(newAppliance) && !DEFAULT_APPLIANCES.includes(newAppliance)) {
      state.settings.customAppliances.push(newAppliance);
    }
    selected.push(newAppliance);
  }
  state.settings.ownedAppliances = selected;
  saveSettings();
  toast('Küchengeräte gespeichert.');
  render();
}
function saveBudget() {
  const raw = document.getElementById('budget-input').value.trim();
  state.settings.weeklyBudget = raw ? parseFloat(raw) : null;
  saveSettings();
  toast(raw ? `Budget auf ${parseFloat(raw).toFixed(2)}€ gesetzt.` : 'Budget entfernt.');
  render();
}
function applySupermarketPreset(key) {
  state.settings.selectedSupermarket = key;
  const preset = SUPERMARKET_PRESETS[key];
  if (preset && preset.order) {
    state.settings.categoryOrder = [...preset.order];
  }
  render();
}
function moveOrder(cat, dir) {
  const order = state.settings.categoryOrder && state.settings.categoryOrder.length ? [...state.settings.categoryOrder] : [...CATEGORIES];
  const i = order.indexOf(cat);
  const j = i + dir;
  if (j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  state.settings.categoryOrder = order;
  render();
}
function saveOrder() {
  state.settings.supermarketName = document.getElementById('supermarket-name').value.trim();
  saveSettings();
  toast('Sortierung gespeichert.');
}

/* ---------------- Utilities ---------------- */

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str) { return escapeHtml(str); }

/* ---------------- Init ---------------- */

(async function init() {
  document.getElementById('app').innerHTML = `<div class="empty-state">Lädt…</div>`;
  await loadState();
  if (!state.plannerWeekStart) state.plannerWeekStart = mondayOf(fmtISO(new Date()));
  render();
})();
</script>
</body>
